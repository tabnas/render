[package]
name = "tabnas-render"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["Richard Rodger <http://richardrodger.com>"]
description = "Renderers for the tabnas transducer protocols: incremental CSV and JSON text from streamed tables and events."
license = "MIT"
repository = "https://github.com/tabnas/render"
readme = "README.md"
include = ["src/**", "README.md", "LICENSE"]
keywords = ["csv", "json", "streaming", "renderer", "parser"]
categories = ["encoding", "text-processing"]

[lib]
name = "tabnas_render"
path = "src/lib.rs"

[dependencies]
# Sibling checkouts, the standard tabnas development model: the transducer
# protocols this crate renders, and the engine they are built on. Each is
# published on crates.io too, and the release workflow rewrites these
# paths into requirements on their newest versions when it publishes this
# crate (admin ADR-21). The engine's crate is tabnas-parser; it keeps the
# `tabnas` name here.
tabnas-transduce = { path = "../../transduce/rs" }
tabnas = { package = "tabnas-parser", path = "../../parser/rs" }

[dev-dependencies]
tabnas-json = { path = "../../json/rs" }
tabnas-jsonl = { path = "../../jsonl/rs" }
tabnas-yaml = { path = "../../yaml/rs" }
tabnas-csv = { path = "../../csv/rs" }
serde_json = { version = "1.0", features = ["preserve_order"] }
# Independent CSV reader, the oracle the rendered CSV is read back with.
csv = "1.3"
criterion = { version = "0.7", default-features = false }
# The fleet's fixture loader, escape codec and runner, for the shared
# test/spec fixtures every runtime runs (rs/tests/spec_*.rs).
tabnas-support = { path = "../../support/rs", features = ["serde_json"] }

[[bench]]
name = "render"
harness = false
