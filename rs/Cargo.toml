[package]
name = "tabnas-render"
version = "0.2.3"
edition = "2021"
rust-version = "1.85"
authors = ["Richard Rodger <http://richardrodger.com>"]
description = "Renderers for the tabnas transducer protocols: incremental CSV and JSON text from streamed tables and events."
license = "MIT"
repository = "https://github.com/tabnas/render"
readme = "README.md"
keywords = ["csv", "json", "streaming", "renderer", "parser"]
categories = ["encoding", "text-processing"]

[lib]
name = "tabnas_render"
path = "src/lib.rs"

[dependencies]
# Sibling checkouts, the standard tabnas development model: the protocols
# this crate renders, which are alchemy's shared types (its `shared` unit
# alone, without the language: `default-features = false`). The engine is
# a dev-dependency: only a test reads values with it.
tabnas-alchemy = { path = "../../alchemy/rs", default-features = false }

[dev-dependencies]
# The engine, for tests/json_readback.rs, which reads rendered JSON back with
# the engine's `Value` (a sibling checkout, like the rest).
tabnas = { package = "tabnas-parser", path = "../../parser/rs" }
# The sources and the table transducer the tests and the benches feed the
# renderers from.
tabnas-transduce = { path = "../../transduce/rs" }
tabnas-json = { path = "../../json/rs" }
tabnas-jsonl = { path = "../../jsonl/rs" }
tabnas-yaml = { path = "../../yaml/rs" }
tabnas-csv = { path = "../../csv/rs" }
serde_json = { version = "1.0", features = ["preserve_order"] }
# Independent CSV reader, the oracle the rendered CSV is read back with.
csv = "1.3"
criterion = { version = "0.7", default-features = false }
# The fleet's fixture loader, escape codec and runner, for the shared
# test/spec fixtures every runtime runs (rs/tests/spec_*.rs).
tabnas-support = { path = "../../support/rs", features = ["serde_json"] }

[[bench]]
name = "render"
harness = false
